<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="62 -19 560 560" fill="none">
  <defs>
    <linearGradient id="rear" x1="145" y1="42" x2="390" y2="355" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5D7FF"/>
      <stop offset=".48" stop-color="#65B0FA"/>
      <stop offset="1" stop-color="#3486E8"/>
    </linearGradient>
    <linearGradient id="header" x1="170" y1="112" x2="560" y2="198" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2865D5"/>
      <stop offset=".55" stop-color="#0758D8"/>
      <stop offset="1" stop-color="#0647C9"/>
    </linearGradient>
    <linearGradient id="panel" x1="176" y1="198" x2="540" y2="425" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset=".56" stop-color="#EAF2FF"/>
      <stop offset="1" stop-color="#D5E5FC"/>
    </linearGradient>
    <linearGradient id="lens" x1="371" y1="251" x2="533" y2="422" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24C5FF"/>
      <stop offset=".48" stop-color="#1478F5"/>
      <stop offset="1" stop-color="#7045F4"/>
    </linearGradient>
    <linearGradient id="command" x1="210" y1="225" x2="344" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2569DF"/>
      <stop offset="1" stop-color="#064DD2"/>
    </linearGradient>
    <radialGradient id="red" cx="0" cy="0" r="1" gradientTransform="matrix(22 25 -25 22 224 145)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF9299"/><stop offset="1" stop-color="#F4485A"/>
    </radialGradient>
    <radialGradient id="yellow" cx="0" cy="0" r="1" gradientTransform="matrix(22 25 -25 22 274 145)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE978"/><stop offset="1" stop-color="#FFB900"/>
    </radialGradient>
    <radialGradient id="green" cx="0" cy="0" r="1" gradientTransform="matrix(22 25 -25 22 325 145)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#91F29A"/><stop offset="1" stop-color="#20C95F"/>
    </radialGradient>
    <filter id="shadow" x="75" y="20" width="530" height="485" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dy="9"/>
      <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lensShadow" x="330" y="230" width="275" height="260" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dy="7"/>
      <feComponentTransfer><feFuncA type="linear" slope=".2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="headerDrop" x="125" y="185" width="455" height="42" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope=".34"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="window">
      <path d="M230 112H526C547 112 560 128 560 150V385C560 407 544 421 522 421H181C159 421 144 404 144 381V153C144 130 161 112 184 112H230Z"/>
    </clipPath>
  </defs>

  <!-- Rear window: complete silhouette, including the full left edge and rounded lower corner -->
  <path d="M178 38
    C192 34 207 38 226 41
    L438 75
    C471 80 491 105 484 139
    L437 321
    C429 355 406 371 374 360
    L145 319
    C112 313 96 287 103 253
    L143 77
    C147 52 157 40 178 38Z"
    fill="url(#rear)" filter="url(#shadow)"/>

  <!-- Front terminal window -->
  <g filter="url(#shadow)">
    <path d="M184 112H526C547 112 560 128 560 150V385C560 407 544 421 522 421H181C159 421 144 404 144 381V153C144 130 161 112 184 112Z"
          fill="url(#panel)"/>
    <g clip-path="url(#window)">
      <path d="M144 153C144 130 161 112 184 112H526C547 112 560 128 560 150V199H144V153Z" fill="url(#header)"/>
      <rect x="144" y="197" width="416" height="3" fill="#173F83" opacity=".34" filter="url(#headerDrop)"/>
    </g>
  </g>

  <!-- Window controls -->
  <circle cx="224" cy="145" r="20" fill="url(#red)"/>
  <circle cx="274" cy="145" r="20" fill="url(#yellow)"/>
  <circle cx="325" cy="145" r="20" fill="url(#green)"/>

  <!-- Terminal prompt -->
  <path d="M218 232L262 266L218 300" stroke="url(#command)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M285 300H335" stroke="#0754D8" stroke-width="19" stroke-linecap="round"/>

  <!-- Search lens and handle -->
  <g filter="url(#lensShadow)">
    <circle cx="448" cy="338" r="89" stroke="#F4F9FF" stroke-width="5"/>
    <circle cx="448" cy="338" r="83" stroke="url(#lens)" stroke-width="34"/>
    <path d="M510 400L568 458" stroke="url(#lens)" stroke-width="35" stroke-linecap="round"/>
  </g>
</svg>