name: sql-studio-test-mysql

x-mysql: &mysql
  environment:
    MYSQL_ROOT_HOST: "%"
    MYSQL_ROOT_PASSWORD: "00000000"
  healthcheck:
    interval: 3s
    timeout: 3s
    retries: 60
    start_period: 90s
    test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql -h 127.0.0.1 -u root -e 'SELECT 1'"]

services:
  mysql:
    <<: *mysql
    image: mysql:8.4.10
    ports: ["127.0.0.1:${SQLSTUDIO_MYSQL_PORT:-13306}:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/10-fixture.sql:ro

  mysql-80:
    <<: *mysql
    image: mysql:8.0
    profiles: [compat]
    ports: ["127.0.0.1:${SQLSTUDIO_MYSQL_80_PORT:-23306}:3306"]
    volumes:
      - mysql-80-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/10-fixture.sql:ro

volumes:
  mysql-data:
  mysql-80-data:
