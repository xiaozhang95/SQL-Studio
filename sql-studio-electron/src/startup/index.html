<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'sha256-yorAAG++g1eXH2tnAPUDneParj4IdyoU+pnmZCzRADA='; img-src data:; base-uri 'none'; form-action 'none'"
    />
    <title>SQL Studio</title>
    <style>
      :root {
        color-scheme: light;
        --brand: #2569df;
        --background: #ffffff;
        --text: #141414;
        --muted: #757575;
        --glow: color-mix(in srgb, var(--brand) 12%, transparent);
      }

      :root[data-theme='dark'] {
        color-scheme: dark;
        --background: #131313;
        --text: #f5f5f5;
        --muted: #969696;
        --glow: color-mix(in srgb, var(--brand) 20%, transparent);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        font: message-box;
        background: var(--background);
        color: var(--text);
        transition: opacity 220ms ease;
      }
      .window-drag {
        position: absolute;
        inset: 0 0 auto;
        height: 32px;
        -webkit-app-region: drag;
      }
      .startup {
        --brand-size: clamp(48px, 9vw, 104px);
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        user-select: none;
        padding: 48px 24px;
      }
      .brand-row {
        display: flex;
        align-items: center;
        gap: clamp(14px, 2vw, 24px);
      }
      .brand {
        position: relative;
        display: grid;
        place-items: center;
        width: var(--brand-size);
        height: var(--brand-size);
        flex-shrink: 0;
      }
      .logo {
        width: 100%;
        height: 100%;
        position: relative;
        animation:
          arrive 480ms ease-out both,
          breathe 2400ms 480ms ease-in-out infinite;
      }
      .logo-halo {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(circle, var(--glow), transparent 70%);
        animation: halo 2400ms ease-in-out infinite;
      }
      h1 {
        margin: 0;
        font-size: calc(var(--brand-size) * 0.72);
        line-height: 1;
        white-space: nowrap;
      }
      .loading {
        margin-top: 32px;
        text-align: center;
        color: var(--muted);
      }
      .loading-dots {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 10px;
      }
      .loading-dots span {
        display: block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.35;
        animation: loading-dots 1200ms ease-in-out infinite;
      }
      .loading-dots span:nth-child(2) {
        animation-delay: 160ms;
      }
      .loading-dots span:nth-child(3) {
        animation-delay: 320ms;
      }
      .is-ready {
        opacity: 0;
      }
      .is-error .loading-dots span,
      .is-error .brand * {
        animation: none;
      }
      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.94);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes breathe {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }
      @keyframes halo {
        0%,
        100% {
          transform: scale(0.9);
          opacity: 0.6;
        }
        50% {
          transform: scale(1.12);
          opacity: 1;
        }
      }
      @keyframes loading-dots {
        0%,
        60%,
        100% {
          opacity: 0.35;
        }
        30% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
        .loading-dots span {
          opacity: 0.65;
        }
      }
    </style>
    <script defer src="./renderer.js"></script>
  </head>
  <body>
    <div class="window-drag" aria-hidden="true"></div>
    <main class="startup" aria-busy="true">
      <div class="brand-row">
        <div class="brand">
          <div class="logo-halo" aria-hidden="true"></div>
          <img class="logo" width="104" height="104" alt="" />
        </div>
        <h1>SQL Studio</h1>
      </div>
      <div class="loading" role="status" aria-label="正在启动 SQL Studio">
        <div class="loading-dots" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
    </main>
  </body>
</html>
