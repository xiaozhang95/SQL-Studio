<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta

      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; base-uri 'none'; form-action 'none'"
    />
    <title>SQL Studio</title>
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./renderer.js"></script>
  </head>
  <body>
